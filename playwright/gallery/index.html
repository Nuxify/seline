<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Story gallery</title>
		<style>
			:root {
				font-family: system-ui, sans-serif;
				color: #18181b;
				background: #f4f4f5;
			}

			body {
				margin: 0;
			}

			.gallery {
				display: grid;
				grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr);
				min-height: 100vh;
			}

			aside {
				padding: 1.5rem;
				background: white;
				border-right: 1px solid #e4e4e7;
			}

			h1,
			h2 {
				margin-top: 0;
			}

			.story-list {
				display: grid;
				gap: 0.5rem;
			}

			.story-button {
				width: 100%;
				padding: 0.65rem 0.75rem;
				border: 1px solid #e4e4e7;
				border-radius: 0.375rem;
				background: white;
				color: inherit;
				text-align: left;
				cursor: pointer;
			}

			.story-button:hover,
			.story-button[aria-pressed='true'] {
				border-color: #71717a;
				background: #f4f4f5;
			}

			main {
				min-width: 0;
				padding: 2rem;
			}

			#root {
				padding: 1.5rem;
				border: 1px solid #e4e4e7;
				border-radius: 0.5rem;
				background: white;
			}

			#gallery-error {
				color: #b91c1c;
			}

			@media (max-width: 640px) {
				.gallery {
					grid-template-columns: 1fr;
				}

				aside {
					border-right: 0;
					border-bottom: 1px solid #e4e4e7;
				}

				.story-list {
					grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
				}

				main {
					padding: 1rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="gallery">
			<aside>
				<h1>Story gallery</h1>
				<p>Select a story to preview it.</p>
				<nav id="story-list" class="story-list" aria-label="Stories"></nav>
			</aside>
			<main>
				<h2 id="story-title">Select a story</h2>
				<p id="gallery-error" role="alert" hidden></p>
				<section id="root" aria-label="Story preview"></section>
			</main>
		</div>
		<script type="module" src="./main.svelte.ts"></script>
	</body>
</html>
